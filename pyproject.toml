[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctxmin"
version = "0.1.0"
description = "Local extractive context minimization gateway for coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ctxmin contributors" }]
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
embeddings = [
  "sentence-transformers>=3.0",
  "torch>=2.1",
]
bench = [
  "datasets>=2.18",
]
faiss = [
  "faiss-cpu>=1.8",
]
dev = [
  "pytest>=8.0",
  "datasets>=2.18",
]

[project.scripts]
ctxmin = "ctxmin.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ctxmin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
